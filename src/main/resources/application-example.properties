# Safe example only; contains no local credentials.
# On a new checkout, copy this file to application.properties (Git ignores it).
# Set DB_URL, DB_USERNAME, DB_PASSWORD, and JWT_SECRET in your local run environment.
# JWT_SECRET must be a private Base64-encoded key suitable for the JWT algorithm.
spring.application.name=equipment-management
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
# Explicit opt-in: existing databases require a reviewed baseline and migration first.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
